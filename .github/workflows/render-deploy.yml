name: Deploy backend to Render

on:
  push:
    branches:
      - codex/reliability-engineering
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Reviewed Web contract; keep pinned to this immutable commit.
      - name: Check out production frontend contract
        uses: actions/checkout@v4
        with:
          repository: yaner0316/wordbot-web
          ref: 6a0e92415492f196953559cb1a15a9f74bed5a64
          path: web-contract
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Run backend tests
        run: npm test
        env:
          SUPABASE_URL: https://wordbot-ci.invalid
          SUPABASE_SERVICE_ROLE_KEY: wordbot-ci-service-role
          FEISHU_APP_ID: wordbot-ci-placeholder
          FEISHU_APP_SECRET: wordbot-ci-placeholder
          FEISHU_WORD_APP_TOKEN: wordbot-ci-placeholder
          FEISHU_WORD_TABLE_ID: wordbot-ci-placeholder
          FEISHU_TEST_APP_TOKEN: wordbot-ci-placeholder
          FEISHU_TEST_TABLE_ID: wordbot-ci-placeholder
          FEISHU_STATS_APP_TOKEN: wordbot-ci-placeholder
          FEISHU_STATS_TABLE_ID: wordbot-ci-placeholder
          WORDBOT_WEB_CONTRACT_PATH: ${{ github.workspace }}/web-contract/src/quiz-logic.js
          WORDBOT_WEB_APP_PATH: ${{ github.workspace }}/web-contract/src/app.js
        working-directory: backend

      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          test -n "$RENDER_DEPLOY_HOOK_URL"
          curl --fail --request POST "$RENDER_DEPLOY_HOOK_URL"
