name: Backend CI and Render deploy

on:
  pull_request:
  push:
    branches:
      - codex/reliability-engineering
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Reviewed Web contract; this is the current wordbot-web main commit.
      - name: Check out production frontend contract
        uses: actions/checkout@v4
        with:
          repository: yaner0316/wordbot-web
          ref: 771d2a1245505504e3bb9c315f2861bb855248c1
          path: web-contract
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Run backend tests
        run: npm test
        env:
          SUPABASE_URL: https://wordbot-ci.invalid
          SUPABASE_SERVICE_ROLE_KEY: wordbot-ci-service-role
          WORDBOT_WEB_CONTRACT_PATH: ${{ github.workspace }}/web-contract/src/quiz-logic.js
          WORDBOT_WEB_APP_PATH: ${{ github.workspace }}/web-contract/src/app.js
        working-directory: backend

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out deployment verification source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node.js 24 for deployment verification
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          test -n "$RENDER_DEPLOY_HOOK_URL"
          curl --fail --request POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Verify public backend release
        run: >-
          node backend/scripts/verify-public-health-release.js
          --health-url https://wordbot-1-w9il.onrender.com/api/health
          --expected-commit ${{ github.sha }}
          --attempts 40
          --interval-ms 15000
